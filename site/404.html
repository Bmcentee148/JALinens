<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | J&amp;A Linen Service</title>
<meta name="description" content="That page isn't here. Call J&A Linen Service in Bay Shore at (631) 665-8888.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1349A5;--blue-ink:#0A2A5E;--red:#C1090D;--red-dark:#9A070A;
  --ink:#111214;--slate:#3F4650;--muted:#646C77;--paper:#F7F5F1;--line:#DDD7CC;
  --display:'Anton',Impact,sans-serif;
  --ui:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --body:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  font-family:var(--body);font-size:17px;line-height:1.65;color:var(--slate);
  background:var(--blue-ink);padding:2rem 1.25rem;-webkit-font-smoothing:antialiased;
}
.card{
  background:var(--paper);max-width:560px;width:100%;text-align:center;
  border-radius:4px;border-top:5px solid var(--red);
  padding:clamp(2.2rem,6vw,3.4rem) clamp(1.5rem,5vw,3rem);
  box-shadow:0 24px 60px rgba(0,0,0,.3);
}
img{height:56px;width:auto;margin:0 auto 1.6rem;display:block}
.code{
  font-family:var(--display);font-weight:400;font-size:clamp(3.6rem,12vw,5.4rem);
  line-height:1;color:var(--line);margin:0 0 .2rem;
}
h1{
  font-family:var(--display);font-weight:400;text-transform:uppercase;
  font-size:clamp(1.6rem,4.6vw,2.15rem);line-height:1.1;color:var(--ink);margin:0 0 .7rem;
}
p{margin:0 0 1.5rem}
.small{font-size:.95rem;color:var(--muted);margin:0}
.btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.8rem}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  font-family:var(--ui);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  font-size:1rem;line-height:1;padding:1rem 1.6rem;border-radius:3px;
  border:2px solid transparent;text-decoration:none;transition:transform .12s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn--call{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-dark)}
.btn--ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn--ghost:hover{background:var(--ink);color:#fff}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
  <main class="card">
    <img src="/assets/img/ja-logo.webp" alt="J&amp;A Linen Service" width="720" height="261">
    <p class="code">404</p>
    <h1>That Page Isn't Here</h1>
    <p>It may have moved when we rebuilt the site. The fastest way to get an answer is still the phone.</p>
    <div class="btns">
      <a class="btn btn--call" href="tel:+16316658888">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.24 11.4 11.4 0 003.6.58 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.4 11.4 0 00.58 3.6 1 1 0 01-.25 1z"/></svg>
        Call (631) 665-8888
      </a>
      <a class="btn btn--ghost" href="/">Back to Site</a>
    </div>
    <p class="small">J&amp;A Coat, Apron &amp; Linen Service &middot; 56&ndash;58 Penataquit Ave, Bay Shore, NY 11706 &middot; Mon&ndash;Fri 8am&ndash;5pm</p>
  </main>
</body>
</html>
